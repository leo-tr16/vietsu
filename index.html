<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Việt Sử">
<meta name="application-name" content="Việt Sử">
<meta name="theme-color" content="#F2F3F7" id="themeColor">
<meta name="description" content="Tra cứu lịch sử Việt Nam: thời kỳ, nhân vật, trận đánh.">
<title>Việt Sử – Tra cứu lịch sử Việt Nam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234B5D78'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%234B5D78'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('vs-theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<style>
  /* =========================================================
     DESIGN TOKENS — Font A (Inter) + Màu Slate
     ========================================================= */
  :root {
    --bg: #F2F3F7;
    --card: #FFFFFF;
    --card-2: #F6F7F9;
    --glass: rgba(242, 243, 247, 0.82);
    --text: #111318;
    --text-2: #3E434D;
    --text-3: #6B707B;
    --hair: rgba(15, 20, 30, 0.09);
    --hair-strong: rgba(15, 20, 30, 0.16);
    --ac: #4B5D78;
    --ac-on: #FFFFFF;
    --ac-soft: rgba(75, 93, 120, 0.10);
    --orange: #9A5B13;
    --orange-i: #C98A2E;
    --orange-soft: rgba(201, 138, 46, 0.13);
    --muted-dot: #A3A8B2;
    --mark-bg: #FFE16B;
    --mark-text: #1A1400;
    --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-sheet: 0 -8px 40px rgba(16, 24, 40, 0.16);

    --f: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    --s-body: 14px;
    --s-meta: 12.5px;
    --s-small: 13px;
    --s-title: 15.5px;
    --s-sec: 19px;
    --s-sheet: 21px;
    --w-head: 600;
    --ls: -0.011em;
    --ls-head: -0.018em;

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --header-h: 52px;
    --tab-h: 60px;
  }
  :root[data-theme="dark"] {
    --bg: #090B10;
    --card: #141820;
    --card-2: #1A1F29;
    --glass: rgba(9, 11, 16, 0.82);
    --text: #F2F3F5;
    --text-2: #C4C8D0;
    --text-3: #959BA6;
    --hair: rgba(255, 255, 255, 0.08);
    --hair-strong: rgba(255, 255, 255, 0.14);
    --ac: #9DB0CC;
    --ac-on: #0B0D12;
    --ac-soft: rgba(157, 176, 204, 0.13);
    --orange: #E3B062;
    --orange-i: #E3B062;
    --orange-soft: rgba(227, 176, 98, 0.14);
    --muted-dot: #5C626E;
    --mark-bg: #FFD60A;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-sheet: 0 -10px 50px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--f); font-size: var(--s-body); line-height: 1.55; letter-spacing: var(--ls);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; letter-spacing: inherit; text-align: left; }
  mark { background: var(--mark-bg); color: var(--mark-text); border-radius: 3px; padding: 0 2px; }
  :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 8px; }
  .tnum { font-feature-settings: 'tnum' 1; }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40; padding-top: var(--safe-t);
    background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hair);
  }
  .topbar-inner { height: var(--header-h); max-width: 720px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 10px; }
  .app-title { flex: 1; font-size: 17px; font-weight: var(--w-head); letter-spacing: var(--ls-head); }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--hair); color: var(--text-2); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 17px; height: 17px; }

  main { max-width: 720px; margin: 0 auto; padding: 12px 16px calc(var(--tab-h) + var(--safe-b) + 24px); }

  /* ---------- Search ---------- */
  .search { position: relative; margin-bottom: 10px; }
  .search input {
    width: 100%; height: 42px; border-radius: 14px; border: 1px solid var(--hair); background: var(--card); color: var(--text);
    padding: 0 40px 0 38px; font: inherit; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input::placeholder { color: var(--text-3); }
  .search input:focus { border-color: var(--ac); box-shadow: 0 0 0 4px var(--ac-soft); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .s-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-3); pointer-events: none; }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; display: none; place-items: center; }
  .search .clear span { width: 18px; height: 18px; border-radius: 50%; background: var(--hair-strong); display: grid; place-items: center; font-size: 10px; color: var(--text-2); }
  .search.has .clear { display: grid; }

  /* ---------- Chips ---------- */
  .chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--hair); font-size: 12.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  .chip.active { background: var(--ac); border-color: var(--ac); color: var(--ac-on); }

  /* ---------- Section ---------- */
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 2px 10px; }
  .sec h2 { margin: 0; font-size: var(--s-sec); font-weight: var(--w-head); letter-spacing: var(--ls-head); }
  .sec span { font-size: 12px; font-weight: 500; color: var(--text-3); }
  .grp-t { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 16px 2px 8px; display: flex; gap: 6px; align-items: center; }
  .grp-t:first-child { margin-top: 4px; }
  .grp-t i { font-style: normal; background: var(--card); border: 1px solid var(--hair); border-radius: 6px; padding: 0 6px; letter-spacing: 0; }
  .view { display: none; }
  .view.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- Cards ---------- */
  .card { position: relative; background: var(--card); border: 1px solid var(--hair); border-radius: 18px; box-shadow: var(--shadow-1); margin-bottom: 8px; }
  .card > button.open { display: block; width: 100%; padding: 12px 44px 12px 14px; }
  .card > button.open:active { opacity: .7; }
  .yr { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--ac-soft); color: var(--ac); font-feature-settings: 'tnum' 1; white-space: nowrap; }
  .yr.alert { background: var(--orange-soft); color: var(--orange); }
  .yr.muted { background: var(--card-2); color: var(--text-3); border: 1px solid var(--hair); }
  .tag { font-size: 11px; color: var(--text-3); margin-left: 6px; }
  .name { font-size: var(--s-title); font-weight: var(--w-head); letter-spacing: var(--ls-head); line-height: 1.3; margin: 5px 0 2px; }
  .meta { font-size: var(--s-meta); color: var(--text-2); }
  .meta b { font-weight: 600; color: var(--text); }
  .ctx { font-size: var(--s-meta); color: var(--text-3); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hit { margin-top: 6px; font-size: 12px; color: var(--text-2); background: var(--card-2); border: 1px solid var(--hair); border-radius: 10px; padding: 5px 9px; }
  .fav { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; display: grid; place-items: center; color: var(--text-3); border-radius: 50%; }
  .fav svg { width: 18px; height: 18px; }
  .fav.on { color: var(--orange-i); }

  /* Timeline */
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 1.5px; background: var(--hair-strong); }
  .dot { position: absolute; left: -20px; top: 18px; width: 11px; height: 11px; border-radius: 50%; background: var(--ac); border: 2.5px solid var(--bg); box-shadow: 0 0 0 1px var(--hair); }
  .dot.alert { background: var(--orange-i); }
  .dot.muted { background: var(--muted-dot); }

  /* People */
  .p-row { display: flex; gap: 12px; align-items: center; }
  .av { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--ac-soft); color: var(--ac); display: grid; place-items: center; font-weight: 600; font-size: 14px; letter-spacing: 0; }
  .p-row .name { margin: 0 0 1px; }

  .empty { text-align: center; padding: 48px 20px; color: var(--text-3); font-size: 13.5px; }
  .empty b { display: block; color: var(--text); font-size: 15px; font-weight: 600; margin-bottom: 4px; }

  /* ---------- Tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding-bottom: var(--safe-b);
    background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--hair);
  }
  .tabbar-inner { max-width: 720px; margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: repeat(4, 1fr); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--text-3); text-align: center; }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: var(--ac); }

  /* ---------- Bottom sheet ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .35); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-width: 720px; margin: 0 auto;
    max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column;
    background: var(--card); border-radius: 22px 22px 0 0; border: 1px solid var(--hair); border-bottom: 0;
    box-shadow: var(--shadow-sheet); transform: translateY(105%); transition: transform .4s cubic-bezier(.22, 1, .36, 1);
  }
  .sheet.show { transform: translateY(0); }
  .sheet.dragging { transition: none; }
  .grabber { flex: none; padding: 9px 0 6px; display: grid; place-items: center; touch-action: none; }
  .grabber span { width: 38px; height: 5px; border-radius: 3px; background: var(--hair-strong); }
  .sheet-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 18px calc(18px + var(--safe-b)); }
  .sh-head { position: relative; padding-right: 40px; margin-bottom: 14px; }
  .sh-close { position: absolute; top: 0; right: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--card-2); border: 1px solid var(--hair); display: grid; place-items: center; color: var(--text-2); }
  .sh-close svg { width: 13px; height: 13px; }
  .sh-title { font-size: var(--s-sheet); font-weight: var(--w-head); letter-spacing: -0.022em; line-height: 1.25; margin: 8px 0 0; }
  .sh-sub { font-size: var(--s-small); color: var(--text-3); margin-top: 2px; }
  .sh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .sh-cell { background: var(--card-2); border: 1px solid var(--hair); border-radius: 12px; padding: 9px 11px; }
  .sh-cell.full { grid-column: 1 / -1; }
  .sh-cell small { display: block; font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 1px; }
  .sh-cell div { font-size: 13.5px; font-weight: 500; }
  .sh-sec { margin-bottom: 16px; }
  .sh-sec h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .sh-sec p { margin: 0; color: var(--text-2); font-size: 13.5px; line-height: 1.6; }
  .sh-sec-highlight { background: var(--card-2); border: 1px solid var(--hair); border-left: 3px solid var(--orange-i); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .sh-sec-highlight h3 { margin: 0 0 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--orange); }
  .sh-sec-highlight p { margin: 0; color: var(--text); font-size: 13.5px; line-height: 1.6; }
  .ev-list, .ac-list { list-style: none; padding: 0; margin: 0; }
  .ev-list li { position: relative; padding: 8px 0 8px 16px; border-bottom: 1px solid var(--hair); color: var(--text-2); font-size: 13.5px; line-height: 1.5; }
  .ev-list li:last-child { border-bottom: 0; }
  .ev-list li::before { content: ''; position: absolute; left: 2px; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: var(--ac); }
  .ac-list li { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; color: var(--text-2); font-size: 13.5px; line-height: 1.5; }
  .ac-list li i { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ac-soft); color: var(--ac); display: grid; place-items: center; margin-top: 2px; }
  .ac-list li i svg { width: 11px; height: 11px; }
  .quote { padding: 12px 14px; border-radius: 14px; background: var(--orange-soft); border-left: 3px solid var(--orange-i); margin-bottom: 16px; }
  .quote p { margin: 0 0 4px; font-size: 14.5px; font-weight: 500; font-style: italic; line-height: 1.5; color: var(--text); }
  .quote cite { font-style: normal; font-size: 12px; color: var(--orange); font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .link { height: 30px; padding: 0 11px; border-radius: 999px; background: var(--ac-soft); color: var(--ac); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; }
  .link:active { opacity: .7; }
  .sh-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; border-radius: 12px; font-weight: 600; font-size: 14px; background: var(--card-2); border: 1px solid var(--hair); color: var(--text); text-align: center; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 16px; height: 16px; }
  .btn.on { background: var(--orange-soft); color: var(--orange); border-color: transparent; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--safe-b) + 14px); z-index: 80;
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    background: rgba(28, 30, 36, .92); color: #fff; font-size: 13.5px; font-weight: 500;
    padding: 9px 14px; border-radius: 12px; transition: all .25s ease; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="app-title">Việt Sử</div>
    <button class="icon-btn" id="themeToggle" aria-label="Chuyển chế độ Sáng/Tối">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </div>
</header>

<main>
  <div class="search" id="searchBox">
    <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Tìm thời kỳ, nhân vật, trận đánh…" aria-label="Tìm kiếm">
    <button class="clear" id="clearQ" aria-label="Xóa tìm kiếm"><span>✕</span></button>
  </div>

  <nav class="chips" id="chips" aria-label="Lọc thời kỳ"></nav>

  <section class="view" id="view-search" aria-label="Kết quả tìm kiếm"></section>

  <section class="view" id="view-periods" aria-label="Niên biểu">
    <div class="sec"><h2>Niên Biểu</h2><span id="cnt-periods"></span></div>
    <div class="tl" id="periodList"></div>
  </section>

  <section class="view" id="view-people" aria-label="Nhân vật">
    <div class="sec"><h2>Nhân Vật</h2><span id="cnt-people"></span></div>
    <div id="peopleList"></div>
  </section>

  <section class="view" id="view-battles" aria-label="Trận đánh">
    <div class="sec"><h2>Trận Đánh</h2><span id="cnt-battles"></span></div>
    <div id="battleList"></div>
  </section>

  <section class="view" id="view-saved" aria-label="Đã lưu">
    <div class="sec"><h2>Đã Lưu</h2><span id="cnt-saved"></span></div>
    <div id="savedList"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Điều hướng chính">
  <div class="tabbar-inner" id="tabbar">
    <button class="tab" data-tab="periods">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="6" cy="19" r="2"/><path d="M11 5h9M11 12h9M11 19h6"/></svg>
      Niên Biểu
    </button>
    <button class="tab" data-tab="people">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      Nhân Vật
    </button>
    <button class="tab" data-tab="battles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M14 5h5v5M5 5l5 5M14 14l5 5"/></svg>
      Trận Đánh
    </button>
    <button class="tab" data-tab="saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
      Đã Lưu
    </button>
  </div>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grabber" id="grabber"><span></span></div>
  <div class="sheet-scroll" id="sheetScroll"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     DATA — AG chỉ bổ sung / chỉnh sửa trong khối này.
     Schema chi tiết: xem AG-BRIEF.md
     tone: 'main' (accent Slate) | 'alert' (cam – kháng chiến, biến cố) | 'muted' (xám – thời kỳ đô hộ)
     ========================================================= */
  var ERAS = [
    { id: 'all', label: 'Tất cả' },
    { id: 'codai', label: 'Cổ đại' },
    { id: 'bacthuoc', label: 'Bắc thuộc' },
    { id: 'doclap', label: 'Độc lập tự chủ' },
    { id: 'phantranh', label: 'Phân tranh' },
    { id: 'candai', label: 'Cận - Hiện đại' }
  ];

    var PERIODS = [
    {
      id: "van-lang",

    store('vs-favs', JSON.stringify(favs));
  }

  /* =========================================================
     THEME / TOAST / COPY
     ========================================================= */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('#themeIcon').innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
    $('#themeColor').setAttribute('content', t === 'dark' ? '#090B10' : '#F2F3F7');
  }
  applyTheme(document.documentElement.getAttribute('data-theme'));
  $('#themeToggle').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next); store('vs-theme', next);
  });

  var toastTimer;
  function toast(msg) {
    var el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }
  function copyText(text) {
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      try { document.execCommand('copy'); toast('Đã sao chép'); } catch (e) { toast('Không thể sao chép'); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Đã sao chép'); }, fallback);
    else fallback();
  }

  /* =========================================================
     CARD RENDERERS
     ========================================================= */
  function favBtn(key) {
    var on = isFav(key);
    return '<button class="fav' + (on ? ' on' : '') + '" data-fav="' + key + '" aria-label="' + (on ? 'Bỏ lưu' : 'Lưu') + '">' + (on ? ICON.starOn : ICON.star) + '</button>';
  }
  function matchedLine(lines, q, exclude) {
    if (!q.trim()) return '';
    if (exclude && has(exclude, q)) return '';
    var m = lines.filter(function (l) { return l && has(l, q); })[0];
    return m ? '<div class="hit">' + hl(m, q) + '</div>' : '';
  }

  function periodCard(p, q, withDot) {
    var key = 'period:' + p.id;
    return (withDot ? '<div style="position:relative">' : '') +
      '<div class="card">' + (withDot ? '<span class="dot ' + p.tone + '"></span>' : '') + favBtn(key) +
      '<button class="open" data-open="' + key + '">' +
      '<span class="yr ' + p.tone + '">' + hl(p.years, q) + '</span><span class="tag">' + eraLabel(p.era) + '</span>' +
      '<div class="name">' + hl(p.name, q) + '</div>' +
      '<div class="meta"><b>' + hl(p.quocHieu, q) + '</b> · ' + hl(p.kinhDo, q) + '</div>' +
      '<div class="ctx">' + hl(p.context, q) + '</div>' +
      matchedLine(p.events.concat(p.vua, p.achievements), q, p.name + ' ' + p.years + ' ' + p.quocHieu + ' ' + p.kinhDo + ' ' + p.context) +
      '</button></div>' + (withDot ? '</div>' : '');
  }

  function personCard(x, q) {
    var key = 'person:' + x.id;
    return '<div class="card">' + favBtn(key) +
      '<button class="open p-row" style="display:flex" data-open="' + key + '">' +
      '<div class="av">' + esc(initials(x.name)) + '</div>' +
      '<div style="min-width:0"><div class="name">' + hl(x.name, q) + '</div>' +
      '<div class="meta"><span class="tnum">' + hl(x.years, q) + '</span> · ' + hl(x.role, q) + '</div>' +
      matchedLine([x.alias, x.origin].concat(x.achievements, [x.summary]), q, x.name + ' ' + x.years + ' ' + x.role) +
      '</div></button></div>';
  }

  function battleCard(b, q) {
    var key = 'battle:' + b.id;
    return '<div class="card">' + favBtn(key) +
      '<button class="open" data-open="' + key + '">' +
      '<span class="yr alert">' + hl(b.year, q) + '</span><span class="tag">' + hl(b.ta + ' vs ' + b.dich, q) + '</span>' +
      '<div class="name">' + hl(b.name, q) + '</div>' +
      '<div class="meta">' + hl(b.place, q) + '</div>' +
      '<div class="ctx">' + hl(b.summary, q) + '</div>' +
      '</button></div>';
  }

  function empty(title, sub) { return '<div class="empty"><b>' + title + '</b>' + sub + '</div>'; }

  /* =========================================================
     LIST FILTERS
     ========================================================= */
  function filterList(type, list) {
    return list.filter(function (x) {
      if (state.era !== 'all' && eraOf(type, x) !== state.era) return false;
      if (state.q.trim() && !has(textOf(type, x), state.q)) return false;
      return true;
    });
  }

  /* =========================================================
     VIEWS
     ========================================================= */
  function renderPeriods() {
    var list = filterList('period', PERIODS);
    $('#cnt-periods').textContent = list.length + ' thời kỳ';
    $('#periodList').innerHTML = list.length ? list.map(function (p) { return periodCard(p, '', true); }).join('') : empty('Không có thời kỳ phù hợp', 'Chọn “Tất cả” để xem toàn bộ.');
  }
  function renderPeople() {
    var list = filterList('person', PEOPLE);
    $('#cnt-people').textContent = list.length + ' nhân vật';
    $('#peopleList').innerHTML = list.length ? list.map(function (x) { return personCard(x, ''); }).join('') : empty('Không có nhân vật phù hợp', 'Chọn “Tất cả” để xem toàn bộ.');
  }
  function renderBattles() {
    var list = filterList('battle', BATTLES);
    $('#cnt-battles').textContent = list.length + ' trận';
    $('#battleList').innerHTML = list.length ? list.map(function (x) { return battleCard(x, ''); }).join('') : empty('Không có trận đánh phù hợp', 'Chọn “Tất cả” để xem toàn bộ.');
  }
  function renderSaved() {
    $('#cnt-saved').textContent = favs.length + ' mục';
    if (!favs.length) { $('#savedList').innerHTML = empty('Chưa lưu mục nào', 'Chạm ☆ trên thời kỳ, nhân vật hoặc trận đánh để lưu tại đây.'); return; }
    var groups = [['period', 'Thời kỳ', periodCard], ['person', 'Nhân vật', personCard], ['battle', 'Trận đánh', battleCard]];
    var html = '';
    groups.forEach(function (g) {
      var items = favs.filter(function (k) { return k.indexOf(g[0] + ':') === 0; }).map(function (k) { return byId[k]; });
      if (!items.length) return;
      html += '<div class="grp-t">' + g[1] + ' <i>' + items.length + '</i></div>' + items.map(function (x) { return g[2](x, ''); }).join('');
    });
    $('#savedList').innerHTML = html;
  }
  function renderSearch() {
    var q = state.q;
    var groups = [
      ['Trận đánh', filterList('battle', BATTLES), battleCard],
      ['Nhân vật', filterList('person', PEOPLE), personCard],
      ['Thời kỳ', filterList('period', PERIODS), periodCard]
    ];
    // Ưu tiên nhóm có tên khớp trực tiếp lên đầu
    groups.sort(function (a, b) {
      var sa = a[1].some(function (x) { return has(x.name, q); }) ? 1 : 0;
      var sb = b[1].some(function (x) { return has(x.name, q); }) ? 1 : 0;
      return sb - sa;
    });
    var total = 0, html = '';
    groups.forEach(function (g) {
      if (!g[1].length) return;
      total += g[1].length;
      html += '<div class="grp-t">' + g[0] + ' <i>' + g[1].length + '</i></div>' + g[1].map(function (x) { return g[2](x, q); }).join('');
    });
    $('#view-search').innerHTML = total ? html : empty('Không tìm thấy kết quả', 'Thử từ khóa khác, có thể gõ không dấu.');
  }

  function render() {
    var searching = state.q.trim().length > 0;
    $$('.view').forEach(function (v) { v.classList.remove('active'); });
    $(searching ? '#view-search' : '#view-' + state.tab).classList.add('active');
    $$('.tab').forEach(function (t) { t.classList.toggle('active', !searching && t.getAttribute('data-tab') === state.tab); });
    $('#chips').style.display = (!searching && state.tab === 'saved') ? 'none' : '';
    $('#searchBox').classList.toggle('has', state.q.length > 0);
    if (searching) renderSearch();
    else if (state.tab === 'periods') renderPeriods();
    else if (state.tab === 'people') renderPeople();
    else if (state.tab === 'battles') renderBattles();
    else renderSaved();
  }

  function renderChips() {
    $('#chips').innerHTML = ERAS.map(function (e) {
      return '<button class="chip' + (state.era === e.id ? ' active' : '') + '" data-era="' + e.id + '">' + e.label + '</button>';
    }).join('');
  }

  /* =========================================================
     BOTTOM SHEET
     ========================================================= */
  var current = null;

  function cell(label, val, full) { return val ? '<div class="sh-cell' + (full ? ' full' : '') + '"><small>' + label + '</small><div>' + esc(val) + '</div></div>' : ''; }
  function listSec(title, items, cls) {
    if (!items || !items.length) return '';
    var li = cls === 'ac'
      ? items.map(function (a) { return '<li><i>' + ICON.check + '</i><span>' + esc(a) + '</span></li>'; }).join('')
      : items.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('');
    return '<div class="sh-sec"><h3>' + title + '</h3><ul class="' + (cls === 'ac' ? 'ac-list' : 'ev-list') + '">' + li + '</ul></div>';
  }
  function textSec(title, t, isHighlight) {
    if (!t) return '';
    var cls = isHighlight ? 'sh-sec-highlight' : 'sh-sec';
    return '<div class="' + cls + '"><h3>' + title + '</h3><p>' + esc(t) + '</p></div>';
  }
  function quoteBlock(qt) { return qt ? '<blockquote class="quote" style="margin-left:0;margin-right:0"><p>“' + esc(qt.text) + '”</p><cite>— ' + esc(qt.by) + '</cite></blockquote>' : ''; }
  function linkSec(title, items) {
    if (!items.length) return '';
    return '<div class="sh-sec"><h3>' + title + '</h3><div class="links">' + items.map(function (it) {
      return '<button class="link" data-open="' + it.key + '">' + esc(it.label) + '</button>';
    }).join('') + '</div></div>';
  }
  function head(badge, badgeCls, tag, title, sub) {
    return '<div class="sh-head"><button class="sh-close" data-close aria-label="Đóng">' + ICON.close + '</button>' +
      '<span class="yr ' + badgeCls + '">' + esc(badge) + '</span>' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') +
      '<h2 class="sh-title">' + esc(title) + '</h2>' + (sub ? '<div class="sh-sub">' + esc(sub) + '</div>' : '') + '</div>';
  }
  function actions(key) {
    var on = isFav(key);
    return '<div class="sh-actions"><button class="btn" data-copy>' + ICON.copy + 'Sao chép tóm tắt</button>' +
      '<button class="btn' + (on ? ' on' : '') + '" data-sheet-fav>' + (on ? ICON.starOn : ICON.star) + (on ? 'Đã lưu' : 'Lưu') + '</button></div>';
  }

  function sheetHTML(type, x) {
    var key = type + ':' + x.id;
    if (type === 'period') {
      var ppl = PEOPLE.filter(function (p) { return p.periodId === x.id; }).map(function (p) { return { key: 'person:' + p.id, label: p.name }; });
      var bts = BATTLES.filter(function (b) { return b.periodId === x.id; }).map(function (b) { return { key: 'battle:' + b.id, label: b.name }; });
      
      var gridHtml = cell('Quốc hiệu', x.quocHieu) + 
                     cell('Kinh đô / Đô sở', x.kinhDo) + 
                     cell('Cương vực & Địa giới', x.cuongVuc, true) + 
                     cell('Nguồn sử liệu khảo chứng', x.sources, true) + 
                     cell('Vua / Lãnh đạo tiêu biểu', x.vua ? x.vua.join(' · ') : '', true);

      return head(x.years, x.tone, eraLabel(x.era), x.name) +
        '<div class="sh-grid">' + gridHtml + '</div>' +
        textSec('Bối cảnh lịch sử thực tế', x.context) + 
        textSec('Cơ cấu thể chế & Xã hội', x.theChe) + 
        textSec('Khảo biện & Giải ảo sử liệu', x.khaoBien, true) + 
        listSec('Dấu ấn & Sự kiện cốt lõi', x.events) + 
        listSec('Kinh tế, Văn hóa & Đột phá kỹ thuật', x.achievements, 'ac') +
        quoteBlock(x.quote) + 
        linkSec('Nhân vật tiêu biểu (' + ppl.length + ')', ppl) + 
        linkSec('Trận đánh & Chiến dịch lớn (' + bts.length + ')', bts) + 
        actions(key);
    }
    if (type === 'person') {
      var pr = get('period', x.periodId);
      var links = [];
      if (pr) links.push({ key: 'period:' + pr.id, label: pr.name });
      (x.battleIds || []).forEach(function (id) { var b = get('battle', id); if (b) links.push({ key: 'battle:' + b.id, label: b.name }); });
      return head(x.years, 'main', x.kind, x.name, x.alias) +
        '<div class="sh-grid">' + cell('Vai trò', x.role, true) + cell('Quê quán', x.origin) + cell('Thời kỳ', pr ? pr.name : '') + '</div>' +
        textSec('Tiểu sử', x.summary) + listSec('Dấu ấn', x.achievements, 'ac') + quoteBlock(x.quote) + linkSec('Liên quan', links) + actions(key);
    }
    var bp = get('period', x.periodId);
    var bl = [];
    if (bp) bl.push({ key: 'period:' + bp.id, label: bp.name });
    (x.personIds || []).forEach(function (id) { var p = get('person', id); if (p) bl.push({ key: 'person:' + p.id, label: p.name }); });
    return head(x.year, 'alert', x.result, x.name, x.place) +
      '<div class="sh-grid">' + cell('Phía ta', x.ta) + cell('Đối phương', x.dich) + '</div>' +
      textSec('Diễn biến', x.summary) + textSec('Chiến thuật', x.tactics) + textSec('Ý nghĩa', x.significance) +
      quoteBlock(x.quote) + linkSec('Liên quan', bl) + actions(key);
  }

  function summaryText(type, x) {
    var L = [];
    if (type === 'period') {
      L.push(x.name + ' (' + x.years + ')', 'Quốc hiệu: ' + x.quocHieu, 'Kinh đô: ' + x.kinhDo, 'Vua / Lãnh đạo: ' + (x.vua ? x.vua.join(', ') : ''));
      if (x.cuongVuc) L.push('Cương vực: ' + x.cuongVuc);
      if (x.sources) L.push('Nguồn sử liệu: ' + x.sources);
      L.push('', 'BỐI CẢNH LỊCH SỬ:', x.context);
      if (x.theChe) L.push('', 'THỂ CHẾ & XÃ HỘI:', x.theChe);
      if (x.khaoBien) L.push('', 'KHẢO BIỆN SỬ HỌC:', x.khaoBien);
      L.push('', 'SỰ KIỆN CỐT LÕI:');
      x.events.forEach(function (e) { L.push('• ' + e); });
      if (x.achievements && x.achievements.length) {
        L.push('', 'THÀNH TỰU & ĐỘT PHÁ:');
        x.achievements.forEach(function (a) { L.push('• ' + a); });
      }
    } else if (type === 'person') {
      L.push(x.name + ' (' + x.years + ')' + (x.alias ? ' – ' + x.alias : ''), x.role, 'Quê quán: ' + x.origin, '', x.summary, '', 'Dấu ấn:');
      x.achievements.forEach(function (a) { L.push('• ' + a); });
    } else {
      L.push(x.name + ' (' + x.year + ')', 'Địa điểm: ' + x.place, 'Phía ta: ' + x.ta + ' · Đối phương: ' + x.dich, 'Kết quả: ' + x.result, '', x.summary, '', 'Chiến thuật: ' + x.tactics, 'Ý nghĩa: ' + x.significance);
    }
    if (x.quote) L.push('', '“' + x.quote.text + '” — ' + x.quote.by);
    return L.join('\n');
  }

  function openSheet(key) {
    var parts = key.split(':'), x = get(parts[0], parts[1]);
    if (!x) return;
    current = key;
    $('#sheetScroll').innerHTML = sheetHTML(parts[0], x);
    $('#sheetScroll').scrollTop = 0;
    $('#sheet').style.transform = '';
    $('#backdrop').classList.add('show');
    $('#sheet').classList.add('show');
    document.body.classList.add('locked');
  }
  function closeSheet() {
    $('#sheet').classList.remove('show', 'dragging');
    $('#sheet').style.transform = '';
    $('#backdrop').classList.remove('show');
    document.body.classList.remove('locked');
    current = null;
  }

  (function () {
    var sheet = $('#sheet'), sc = $('#sheetScroll');
    var y0 = 0, dy = 0, on = false, handle = false, ly = 0, lt = 0, v = 0;
    function start(e, h) {
      if (!sheet.classList.contains('show')) return;
      handle = h;
      if (!h && sc.scrollTop > 0) return;
      y0 = ly = e.touches[0].clientY; lt = Date.now(); dy = 0; v = 0; on = true;
    }
    function move(e) {
      if (!on) return;
      var y = e.touches[0].clientY, now = Date.now();
      dy = y - y0; v = (y - ly) / Math.max(1, now - lt); ly = y; lt = now;
      if (dy <= 0) { if (!handle) { on = false; sheet.classList.remove('dragging'); sheet.style.transform = ''; } return; }
      if (e.cancelable) e.preventDefault();
      sheet.classList.add('dragging');
      sheet.style.transform = 'translateY(' + dy + 'px)';
    }
    function end() {
      if (!on) return;
      on = false; sheet.classList.remove('dragging');
      if (dy > 110 || v > 0.6) closeSheet(); else sheet.style.transform = '';
    }
    $('#grabber').addEventListener('touchstart', function (e) { start(e, true); }, { passive: true });
    sc.addEventListener('touchstart', function (e) { start(e, false); }, { passive: true });
    sheet.addEventListener('touchmove', move, { passive: false });
    sheet.addEventListener('touchend', end);
    sheet.addEventListener('touchcancel', end);
  })();

  /* =========================================================
     EVENTS
     ========================================================= */
  var qi = $('#q'), qt;
  qi.addEventListener('input', function () {
    state.q = qi.value;
    $('#searchBox').classList.toggle('has', state.q.length > 0);
    clearTimeout(qt); qt = setTimeout(render, 60);
  });
  qi.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { qi.value = ''; state.q = ''; render(); }
    if (e.key === 'Enter') qi.blur();
  });
  $('#clearQ').addEventListener('click', function () { qi.value = ''; state.q = ''; render(); qi.focus(); });

  $('#chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-era]'); if (!b) return;
    state.era = b.getAttribute('data-era'); renderChips(); render();
  });

  $('#tabbar').addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]'); if (!t) return;
    state.tab = t.getAttribute('data-tab'); store('vs-tab', state.tab);
    if (state.q) { qi.value = ''; state.q = ''; }
    render(); window.scrollTo(0, 0);
  });

  $('main').addEventListener('click', function (e) {
    var f = e.target.closest('[data-fav]');
    if (f) { e.stopPropagation(); toggleFav(f.getAttribute('data-fav')); render(); return; }
    var o = e.target.closest('[data-open]');
    if (o) openSheet(o.getAttribute('data-open'));
  });

  $('#sheet').addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    var l = e.target.closest('[data-open]');
    if (l) { openSheet(l.getAttribute('data-open')); return; }
    if (!current) return;
    var parts = current.split(':'), x = get(parts[0], parts[1]);
    if (e.target.closest('[data-copy]')) copyText(summaryText(parts[0], x));
    if (e.target.closest('[data-sheet-fav]')) {
      toggleFav(current);
      var y = $('#sheetScroll').scrollTop;
      $('#sheetScroll').innerHTML = sheetHTML(parts[0], x);
      $('#sheetScroll').scrollTop = y;
      render();
    }
  });
  $('#backdrop').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && current) closeSheet(); });

  renderChips();
  render();
})();
</script>
</body>
</html>
